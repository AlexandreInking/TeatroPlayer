# Configuración de `cargo about` (T-OPS-005).
#
# Genera el aviso de terceros que hay que repartir junto al binario, que es una
# obligación de la GPL-3.0 (`Docs/11`). La lista es la misma que la de
# `deny.toml`: si una licencia no está aquí, el aviso no se genera.

# Solo el objetivo que publicamos: así el aviso no incluye dependencias que
# nunca llegan al ejecutable.
targets = ["x86_64-pc-windows-msvc"]

accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    # Fuentes que egui incrusta para poder dibujar texto.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Las dependencias de compilación y de desarrollo no llegan al binario, así que
# no pinta nada incluirlas en el aviso.
ignore-build-dependencies = true
ignore-dev-dependencies = true
