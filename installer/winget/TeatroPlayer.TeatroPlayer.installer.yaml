# El InstallerSha256 corresponde al instalador de ESTA version. Si se
# recompila el instalador, cambia: hay que volver a calcularlo con
#   (Get-FileHash TeatroPlayer-Instalador.exe -Algorithm SHA256).Hash
# o copiarlo de lo que imprime scripts\publicar.ps1.
#
# `Scope: user` es importante: el instalador no pide administrador, así que
# winget debe saberlo para no lanzar un UAC innecesario.

PackageIdentifier: TeatroPlayer.TeatroPlayer
PackageVersion: 0.3.0
Installers:
  - Architecture: x64
    InstallerType: nsis
    InstallerUrl: https://github.com/AlexandreInking/TeatroPlayer/releases/download/v0.3.0/TeatroPlayer-Instalador.exe
    InstallerSha256: 05744A3D08F0537B99C23FD9E10C39A6FB0F3374EDDA9922C381619DFFB60ECD
    Scope: user
    InstallModes:
      - silent
      - silentWithProgress
    FileExtensions:
      - tpshow
PackageLocale: es-ES
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.0.0
ManifestType: installer
ManifestVersion: 1.9.0
