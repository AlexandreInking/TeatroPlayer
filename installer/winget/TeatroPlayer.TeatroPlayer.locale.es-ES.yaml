ShortDescription: Reproductor de audio para teatro con fades y crossfades en tiempo real
Description: >-
  Reproductor de audio para teatro. Carga una carpeta de audios, configura cómo
  entra y cómo sale cada uno (de golpe, con fade o en crossfade) y guarda la obra
  entera en un único archivo .tpshow que lleva los audios dentro. Pensado para
  que lo maneje alguien sin conocimientos técnicos: sin consola, sin instalación
  con permisos de administrador y sin depender de internet.
